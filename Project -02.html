<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application web</title>
    <link rel="stylesheet" href="style01.css">
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>Job Application <small>(Web)</small></h1>

            <form>
                <div class="form_container">
                    <div class="form_control">
                        <label>First Name</label>
                        <input type="text">
                    </div>
                    <div class="form_control">
                        <label>Last Name</label>
                        <input type="text">
                    </div>
                    <div class="form_control">
                        <label>Email</label>
                        <input type="email">
                    </div>
                    <div class="form_control">
                        <label>Job Role</label>
                        <select>
                            <option>Choose</option>
                            <option>Frontend Developer</option>
                            <option>Backend Developer</option>
                            <option>Web Developer</option>
                            <option>AI Developer</option>
                        </select>
                    </div>
                    <div class="form_control full-width">
                        <label>Address</label>
                        <textarea cols="5" placeholder="Enter Address"></textarea>
                    </div>
                    <div class="form_control">
                        <label>City</label>
                        <input type="text">
                    </div>
                    <div class="form_control">
                        <label>Pincode</label>
                        <input type="number">
                    </div>
                    <div class="form_control">
                        <label>Start date</label>
                        <input type="date">
                    </div>
                    <div class="form_control">
                        <label>Uplode your CV</label>
                        <input type="file">
                    </div>
                    


                </div>
            </form>
            <div class="button_control">
                        <button type="submit">Apply Now</button>
                    </div>
        </div>
        
    </div>


    </div>

</body>

</html>
