<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Card</title>
    <style>
        * {
            box-sizing:border-box;
            padding: 0;
            margin:0;
         }
         body{
            background-color:plum;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            display:flex;
            justify-content: center;
            padding: 20px;
            align-items:center;
            min-height: 100vh;

         }
         .container{
            background-color: white;
            width:100%;
            max-width:480px;
            padding:50px;
            text-align: center;
            border: 2px solid black;
            box-shadow:0 10px 30px;
            position:relative;
        }
        .container-inner-border{
            border: 2px solid rgb(95, 59, 24);
            padding:30px 30px;
            height:100%;
        }
        .icon{
            font-size: 24px;
            color:burlywood;
            letter-spacing:4px;
            margin-bottom: 15px;
        }
        .paragraph{
         color: gray;
        }
        .heading{
          font-family:i;
          font-style: italic;
          font-size: 36px;
          line-height:1.2;
          color:navy;
        }
        span{
            font-size:25px;

        }
        .para{
            padding: 10px;
            font-style: italic;
            font-size: 17px;
            color:;
        }
        .decorative-icon{
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            padding: 15px 0;
            margin-bottom: 24px;
        }
        .para1{
            font-size: large;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color:goldenrod;

        }
        .para2{
            font-size:18px;
            font-style: italic;

        }
        .para3{
            font-size:17px;
            color:rgb(106, 21, 50);
            text-transform: uppercase;
            

        }
        .para4{
            text-transform: uppercase;
            color:rgb(106, 21, 50);
        }
        .para5{
            text-transform: uppercase;
            color:rgb(106, 21, 50);;
            margin-bottom: 20px;
        }
        .rsvp-button {
            display: inline-block;
            background-color: rgb(225, 64, 64);
            color: rgb(23, 21, 21);
            text-decoration: none;
            /* text-transform: uppercase; */
            letter-spacing: 2px;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 35px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        /* Hover animation effect */
        .rsvp-button:hover {
            background-color: #ffffff;
            color: #b8966e;
            border-color: #b8966e;
            cursor: pointer;
        }
       


    </style>
</head>
 
<body>
    <div class="container">
        <div class="container-inner-border">
            <div class="icon">❖</div>
            <p class="paragraph">TOGETHER WITH THEIR FAMILIES</p>
            <h1 class="heading">Malayaranjan Rout
                <br>
                <span>Weds</span><br>
                 Subhasmita Samal
            </h1>
            <p class="para">
                request thr honour of your presence at the celebration of their marriage

            </p>
            <div class="decorative-icon">
               <p class="para1"> SATARDAY, AUG 8, 2026 </p>
                <p class="para2">at four o'clock in the afternoon</p>

            </div>
            <div class="place">
                <p class="para3">Subhajyoti Mandap </p>
                <p class="para4">P-143 Shreenagar Road</p>
                <p class="para5">Soro, Balasore</p>

            </div>
            <!-- <a href="#rsvp" class="rsvp-button">Online Reservation</a> -->
             <a href="#rsvp" class="rsvp-button">Online Reservation</a>
        </div>

    </div>
    
</body>
</html>
