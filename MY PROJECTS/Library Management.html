<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f4f7;
    padding: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    flex: 1;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #007bff;
    color: white;
}

button:hover {
    opacity: 0.85;
}

#search {
    width: 100%;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
}

th {
    background: #007bff;
    color: white;
}

.issue {
    background: #dc3545;
}

.return {
    background: #28a745;
}

.delete {
    background: #6c757d;
}
     </style>

</head>
<body>

    <div class="container">
        <h1>📚 Library Management System</h1>

        <div class="form">
            <input type="text" id="bookId" placeholder="Book ID">
            <input type="text" id="bookName" placeholder="Book Name">
            <input type="text" id="author" placeholder="Author Name">
            <button onclick="addBook()">Add Book</button>
        </div>

        <input 
            type="text" 
            id="search" 
            placeholder="Search by book name or author..."
            onkeyup="searchBook()"
        >

        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="bookTable">
            </tbody>
        </table>
    </div>

    <script>
        let books = [];

function addBook() {
    let id = document.getElementById("bookId").value;
    let name = document.getElementById("bookName").value;
    let author = document.getElementById("author").value;

    if (id === "" || name === "" || author === "") {
        alert("Please fill all fields!");
        return;
    }

    let book = {
        id: id,
        name: name,
        author: author,
        status: "Available"
    };

    books.push(book);

    clearInputs();
    displayBooks();
}

function displayBooks(bookList = books) {
    let table = document.getElementById("bookTable");

    table.innerHTML = "";

    bookList.forEach((book, index) => {
        let row = `
            <tr>
                <td>${book.id}</td>
                <td>${book.name}</td>
                <td>${book.author}</td>
                <td>${book.status}</td>

                <td>
                    ${
                        book.status === "Available"
                        ? `<button class="issue" onclick="issueBook(${index})">
                            Issue
                           </button>`
                        : `<button class="return" onclick="returnBook(${index})">
                            Return
                           </button>`
                    }

                    <button class="delete" onclick="deleteBook(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

        table.innerHTML += row;
    });
}

function issueBook(index) {
    books[index].status = "Issued";
    displayBooks();
}

function returnBook(index) {
    books[index].status = "Available";
    displayBooks();
}

function deleteBook(index) {
    if (confirm("Are you sure you want to delete this book?")) {
        books.splice(index, 1);
        displayBooks();
    }
}

function searchBook() {
    let searchValue = document
        .getElementById("search")
        .value
        .toLowerCase();

    let filteredBooks = books.filter(book =>
        book.name.toLowerCase().includes(searchValue) ||
        book.author.toLowerCase().includes(searchValue)
    );

    displayBooks(filteredBooks);
}

function clearInputs() {
    document.getElementById("bookId").value = "";
    document.getElementById("bookName").value = "";
    document.getElementById("author").value = "";
}
    </script>
</body>
</html>
